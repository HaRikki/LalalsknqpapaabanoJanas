services:
  - type: web
    name: anajak-host
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: anajak-db
          property: connectionString
      - key: APP_URL
        sync: false
      - key: DEBUG
        value: "false"
      - key: DOCKER_ENABLED
        value: "false"
      - key: CLOUDFLARE_TUNNEL_ENABLED
        value: "false"
      - key: HUMAN_VERIFY_ENABLED
        value: "false"
      - key: ADMIN_EMAIL
        value: admin@anajakhost.local
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.11.0"

databases:
  - name: anajak-db
    plan: free
